<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header-container">
        <h1 id="header">
            Tasks
        </h1>
        <h2 id="sub-heading">
            0 tasks remaining
        </h2>
    </div>

    <div class="task-entry-container">
        <div>
            <input type="text" id="text-box" placeholder="Add a new task">
        </div>
        <div class="task-button-container">
            <div>
                <input type="date" id="due-date" name="due-date">
                <button id="cancelButton">Cancel</button>
                <button id="addTaskButton">Add Task</button>
            </div>
        </div>

        <div class="todo-list-container">
            <ul id="todo-list">

            </ul>
        </div>

        <!-- Template for task items (hidden, used by JavaScript) -->
        <template id="task-template">
            <li>
                <input type="checkbox" class="task-checkbox">
                <div class="task-content">
                    <span class="task-name"></span>
                    <span class="task-date"></span>
                    <div class="task-actions">
                        <button class="edit-btn">
                            <img src="img/pencil-svgrepo-com.svg" alt="Edit">
                        </button>
                        <button class="delete-btn">
                            <img src="img/trash-bin-minimalistic-svgrepo-com.svg" alt="Delete">
                        </button>
                    </div>
                </div>
            </li>
        </template>
    </div>

    <script src="script.js"></script>
</body>
</html>
